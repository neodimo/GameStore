name: Verify GameStore core

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run check:media-light
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npm run check:bundle-size
